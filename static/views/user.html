<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs | Gestión Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Utilidades para ocultar scrollbars pero permitir scroll funcional */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Asegurar que la tabla no se rompa en pantallas muy pequeñas */
        .table-fixed-layout { table-layout: fixed; width: 100%; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<nav class="bg-black p-4 shadow-2xl sticky top-0 z-50 border-b-2 border-[#10b981]">
    <div class="container mx-auto flex items-center justify-between gap-4">
        
        <div onclick="window.location.href='/dashboard/'" class="cursor-pointer shrink-0 flex items-center bg-[#10b981] px-4 py-2 rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.4)] hover:scale-105 transition-transform">
            <span class="text-white font-black text-xl tracking-tighter uppercase">Take</span>
            <span class="text-black font-black text-xl tracking-tighter uppercase ml-0.5">Us</span>
        </div>
        
        <div class="flex overflow-x-auto gap-2 no-scrollbar py-1">
            <button onclick="window.location.href='/dashboard/users'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap ring-2 ring-white">Users</button>
            <button onclick="window.location.href='/dashboard/clients'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Clients</button>
            <button onclick="window.location.href='/dashboard/companies'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Companies</button>
            <button onclick="window.location.href='/dashboard/drivers'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Drivers</button>
            <button onclick="window.location.href='/dashboard/vehicles'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Vehicles</button>
            <button onclick="window.location.href='/dashboard/bookings'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Bookings</button>
            <button onclick="window.location.href='/dashboard/events'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Events</button>
            <button onclick="window.location.href='/dashboard/rides'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Rides</button>
            <button onclick="window.location.href='/dashboard/payments'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Payments</button>
            <button onclick="window.location.href='/dashboard/ratings'" class="bg-[#10b981] text-black text-[11px] font-black uppercase tracking-tighter px-4 py-2 rounded shadow-lg hover:bg-white hover:text-[#10b981] transition-all whitespace-nowrap">Ratings</button>
        </div>

        <div class="flex gap-2 shrink-0">
            <button onclick="exportData('pdf')" class="w-9 h-9 flex items-center justify-center rounded-full bg-red-600 text-white hover:bg-white hover:text-red-600 border-2 border-transparent hover:border-red-600 transition-all">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
            </button>
            <button onclick="exportData('excel')" class="w-9 h-9 flex items-center justify-center rounded-full bg-emerald-600 text-white hover:bg-white hover:text-emerald-600 border-2 border-transparent hover:border-emerald-600 transition-all">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"></path><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"></path></svg>
            </button>
            <button onclick="window.location.href='/dashboard/'" class="w-9 h-9 flex items-center justify-center rounded-full bg-white text-black hover:bg-black hover:text-white border-2 border-black transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
        </div>
    </div>
</nav>

    <main class="container mx-auto py-6 px-4 max-w-3xl">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl md:text-2xl font-black text-black uppercase italic tracking-tighter">Usuarios</h2>
            <button onclick="window.location.href='/dashboard/users/manage'" 
                class="bg-black text-[#10b981] px-4 py-2 rounded-lg font-black text-[10px] hover:bg-[#10b981] hover:text-black transition-all shadow-xl border border-[#10b981] uppercase tracking-widest">
                + NUEVO
            </button>
        </div>

        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
            
            <div class="p-2 bg-gray-900 flex justify-between items-center px-4">
                <div class="flex items-center gap-2">
                    <span class="text-[8px] font-black text-white uppercase italic">Filas:</span>
                    <select id="pageSize" onchange="loadUsers()" class="bg-[#10b981] text-black rounded px-1.5 py-0.5 text-[9px] font-black outline-none cursor-pointer">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="0">ALL</option>
                    </select>
                </div>
                <div id="pagination-info" class="text-[9px] font-black text-[#10b981] uppercase tracking-tighter">
                    Cargando registros...
                </div>
            </div>
            
            <div class="overflow-x-auto no-scrollbar">
                <table class="table-fixed-layout text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr class="text-[8px] font-black text-gray-400 uppercase tracking-widest">
                            <th class="px-3 py-2 w-1/2 md:w-2/5">Usuario / Email</th>
                            <th class="px-3 py-2 w-1/4 text-center">Rol</th>
                            <th class="px-3 py-2 w-1/4 text-center">Estado</th>
                            <th class="px-3 py-2 w-[80px] text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-gray-100 text-[10px] italic font-medium">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/user.js"></script>
</body>
</html>
