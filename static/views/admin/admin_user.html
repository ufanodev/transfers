<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs Admin | Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        admin: {
                            dark: '#1e293b',   // Slate 800
                            accent: '#3b82f6', // Blue 500
                            success: '#10b981' // Emerald 500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl overflow-y-auto shrink-0">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'"
                class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span
                    class="text-admin-accent">Us</span> <span
                    class="text-[10px] bg-admin-accent px-1 rounded text-white ml-1">ADMIN</span></h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-6">
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Gestión de Sistema
                </h3>
                <ul class="space-y-1">
                    <li><a href="/admin/users"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold transition-all shadow-lg"><i
                                class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                    <li><a href="/admin/clients"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i
                                class="fa-solid fa-address-book"></i> Clientes</a></li>
                    <li><a href="/admin/companies"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i
                                class="fa-solid fa-building"></i> Empresas</a></li>
                </ul>
            </div>
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Logística</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/drivers"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i
                                class="fa-solid fa-id-card"></i> Conductores</a></li>
                    <li><a href="/admin/vehicles"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i
                                class="fa-solid fa-car"></i> Vehículos</a></li>
                    <li><a href="/admin/rides"
                            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i
                                class="fa-solid fa-route"></i> Viajes (Rides)</a></li>
                </ul>
            </div>
        </nav>
        <div class="p-4 bg-slate-900">
            <a href="/logout"
                class="flex items-center justify-center gap-2 w-full py-2 rounded-lg bg-red-500/20 text-red-400 font-bold hover:bg-red-500 hover:text-white transition-all text-xs">
                <i class="fa-solid fa-power-off"></i> SALIR
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">

        <header
            class="bg-black p-4 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between overflow-x-auto no-scrollbar">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="window.location.href='/admin/users'"
                    class="bg-admin-accent text-white text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg shadow-lg ring-1 ring-white">Users</button>
                <button onclick="window.location.href='/admin/clients'"
                    class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Clients</button>
                <button onclick="window.location.href='/admin/drivers'"
                    class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Drivers</button>
                <button onclick="window.location.href='/admin/bookings'"
                    class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Bookings</button>
                <button onclick="window.location.href='/admin/rides'"
                    class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Rides</button>
                <button onclick="window.location.href='/admin/payments'"
                    class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Payments</button>
            </div>

            <div class="flex gap-2 shrink-0 ml-4">
                <button onclick="exportData('pdf')"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white transition-all shadow-sm"
                    title="Exportar PDF">
                    <i class="fa-solid fa-file-pdf text-xs"></i>
                </button>

                <button onclick="exportData('excel')"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white transition-all shadow-sm"
                    title="Exportar Excel">
                    <i class="fa-solid fa-file-excel text-xs"></i>
                </button>

                <button onclick="window.location.href='/admin'"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-black border-2 border-black hover:bg-black hover:text-white transition-all shadow-sm"
                    title="Volver al Panel">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
            </div>
        </header>

        <section class="p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto">

                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6">
                    <div class="w-full md:w-2/3">
                        <label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Búsqueda
                            Avanzada</label>
                        <div class="relative">
                            <i
                                class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="userSearch" placeholder="Buscar por usuario, email o rol..."
                                class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-admin-accent outline-none shadow-sm transition-all"
                                onkeyup="filterUsers()">
                        </div>
                    </div>

                    <button onclick="window.location.href='/admin/users/manage'"
                        class="bg-admin-dark text-white px-6 py-2.5 rounded-xl font-black text-[10px] hover:bg-admin-accent transition-all shadow-xl flex items-center gap-2 uppercase tracking-widest">
                        <i class="fa-solid fa-user-plus"></i> NUEVO USUARIO
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span
                                class="text-[9px] font-black text-slate-400 uppercase tracking-widest italic">Mostrar:</span>
                            <select id="pageSize" onchange="loadUsers()"
                                class="bg-white border border-slate-200 rounded px-2 py-1 text-[10px] font-bold outline-none cursor-pointer">
                                <option value="10">10 registros</option>
                                <option value="25">25 registros</option>
                                <option value="0">Todos</option>
                            </select>
                        </div>
                        <div id="pagination-info" class="text-[10px] font-black text-admin-accent uppercase italic">
                            Sincronizando con base de datos...
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-200">
                                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-6 py-4 cursor-pointer hover:text-admin-accent"
                                        onclick="sortBy('username')">Usuario / Email <i
                                            class="fa-solid fa-sort ml-1 opacity-30"></i></th>
                                    <th class="px-6 py-4 text-center cursor-pointer hover:text-admin-accent"
                                        onclick="sortBy('role')">Rol <i class="fa-solid fa-sort ml-1 opacity-30"></i>
                                    </th>
                                    <th class="px-6 py-4 text-center">Estado</th>
                                    <th class="px-6 py-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="user-table-body" class="divide-y divide-slate-100 text-sm font-medium">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/admin/admin_user.js"></script>
</body>

</html>
