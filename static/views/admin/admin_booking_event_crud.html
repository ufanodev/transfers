<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TakeUs Admin | Gestión de Evento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { admin: { dark: '#1e293b', accent: '#3b82f6' } } } } }
    </script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl shrink-0 border-r border-slate-700">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'" class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span class="text-admin-accent">Us</span></h2>
        </div>
        <nav class="flex-1 px-4 py-6">
            <ul class="space-y-1">
                <li><a href="/admin/events" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold shadow-lg text-[11.5px]"><i class="fa-solid fa-clock-rotate-left"></i> Eventos</a></li>
            </ul>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-black p-3 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between">
            <button onclick="window.location.href='/admin/events'" class="bg-admin-accent text-white text-[9px] font-black uppercase px-3 py-1.5 rounded-lg hover:bg-white hover:text-admin-accent transition-all">Volver al Log</button>
            <button onclick="window.location.href='/admin'" class="w-7 h-7 flex items-center justify-center rounded-full bg-white text-black border-2 border-black hover:bg-admin-accent hover:text-white transition-all"><i class="fa-solid fa-home text-[10px]"></i></button>
        </header>

        <section class="p-8 overflow-y-auto flex justify-center items-center">
            <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-900 p-6 text-white text-center">
                    <h2 class="text-sm font-black uppercase tracking-widest italic">Nueva Entrada de Auditoría</h2>
                    <p class="text-[9px] text-slate-400 font-bold uppercase italic mt-1">Rectificación o Nota Manual</p>
                </div>
                
                <form id="event-form" class="p-8 space-y-5">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-1">ID de Reserva Asociada</label>
                        <input type="number" id="booking_id" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-black outline-none focus:ring-1 focus:ring-admin-accent">
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Tipo de Evento / Acción</label>
                        <select id="event_type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 font-black outline-none italic">
                            <option value="manual_note">NOTA MANUAL</option>
                            <option value="rectification">RECTIFICACIÓN DE DATOS</option>
                            <option value="incident">INCIDENCIA EN RUTA</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Descripción del Suceso</label>
                        <textarea id="description" required rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs italic font-medium outline-none focus:ring-1 focus:ring-admin-accent" placeholder="Escriba los detalles aquí..."></textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full bg-admin-dark text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-admin-accent transition-all shadow-xl active:scale-95">
                            Registrar Evento en Auditoría
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="/js/admin/admin_booking_event_crud.js"></script>
</body>
</html>
