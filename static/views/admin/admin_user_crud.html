<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs Admin | Gestión de Usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        admin: {
                            dark: '#1e293b',
                            accent: '#3b82f6',
                            success: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl overflow-y-auto shrink-0 border-r border-slate-700">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'" class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span class="text-admin-accent">Us</span> <span class="text-[10px] bg-admin-accent px-1 rounded text-white ml-1">ADMIN</span></h2>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-6">
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Gestión de Sistema</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold transition-all shadow-lg text-[11.5px]"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                    <li><a href="/admin/clients" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-address-book"></i> Clientes</a></li>
                    <li><a href="/admin/companies" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-building"></i> Empresas</a></li>
                </ul>
            </div>

            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Logística</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/drivers" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-id-card"></i> Conductores</a></li>
                    <li><a href="/admin/vehicles" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-car"></i> Vehículos</a></li>
                    <li><a href="/admin/rides" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-route"></i> Viajes (Rides)</a></li>
                </ul>
            </div>
        </nav>

        <div class="p-4 bg-slate-900">
            <a href="/logout" class="flex items-center justify-center gap-2 w-full py-2 rounded-lg bg-red-500/20 text-red-400 font-bold hover:bg-red-500 hover:text-white transition-all text-xs">
                <i class="fa-solid fa-power-off"></i> SALIR
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-black p-3 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between">
            <div class="flex gap-2">
                <button onclick="window.location.href='/admin/users'" class="bg-admin-accent text-white text-[9px] font-black uppercase px-3 py-1.5 rounded-lg hover:bg-white hover:text-admin-accent transition-all">Volver a lista</button>
            </div>
            <div class="flex gap-2">
                <button onclick="window.location.href='/admin'" class="w-7 h-7 flex items-center justify-center rounded-full bg-white text-black border border-black transition-all hover:bg-admin-accent hover:text-white"><i class="fa-solid fa-home text-[10px]"></i></button>
            </div>
        </header>

        <section class="p-8 overflow-y-auto flex justify-center">
            <div class="w-full max-w-md">
                <h2 id="page-title" class="text-lg font-black text-slate-800 uppercase italic mb-6 text-center underline decoration-admin-accent decoration-4 underline-offset-8">Nuevo Usuario</h2>
                
                <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                    <form id="crud-form" class="p-8 space-y-4">
                        <input type="hidden" id="userId">
                        
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Username</label>
                            <input type="text" id="username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs focus:ring-1 focus:ring-admin-accent outline-none font-bold">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Email Corporativo</label>
                            <input type="email" id="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs focus:ring-1 focus:ring-admin-accent outline-none font-bold">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Password</label>
                                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs focus:ring-1 focus:ring-admin-accent outline-none font-bold">
                                <p id="pass-hint" class="text-[8px] text-admin-accent italic hidden mt-1">Vacío = No cambia</p>
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Rol de Acceso</label>
                                <select id="role" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-[10px] font-bold outline-none uppercase cursor-pointer">
                                    <option value="admin">Admin</option>
                                    <option value="client">Client</option>
                                    <option value="driver">Driver</option>
                                    <option value="company">Company</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <input type="checkbox" id="is_active" checked class="w-4 h-4 accent-admin-accent cursor-pointer">
                            <span class="text-[10px] font-black text-slate-600 uppercase">Cuenta Habilitada</span>
                        </div>

                        <div class="flex flex-col gap-2 pt-4">
                            <button type="submit" id="btn-save" class="w-full bg-admin-dark text-white py-3 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-admin-accent transition-all shadow-lg active:scale-95">
                                Guardar Registro
                            </button>
                            
                            <button type="button" id="btn-delete-trigger" class="hidden w-full text-red-500 text-[9px] font-black uppercase py-2 hover:text-red-700 transition-all italic">
                                — Eliminar Usuario Definitivamente —
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div id="delete-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border-2 border-red-500">
            <h3 class="text-red-600 font-black uppercase italic mb-2 tracking-tighter text-sm">¡Atención: Borrado Crítico!</h3>
            <p class="text-[11px] text-slate-500 mb-6 font-medium leading-tight">Para confirmar el borrado de <span id="confirm-user-name" class="font-bold text-slate-800"></span>, escriba los datos exactos:</p>
            
            <div class="space-y-3">
                <input type="text" id="confirm-username" placeholder="Confirmar Username" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-[10px] font-bold outline-none focus:border-red-500 transition-all">
                <input type="email" id="confirm-email" placeholder="Confirmar Email" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-[10px] font-bold outline-none focus:border-red-500 transition-all">
                <input type="text" id="confirm-key" placeholder="Escriba 'ELIMINAR'" class="w-full bg-red-50 border border-red-100 rounded-lg py-2 px-3 text-[10px] font-bold outline-none text-red-600 uppercase font-black">
            </div>

            <div class="flex gap-2 mt-8">
                <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-slate-200">Cancelar</button>
                <button onclick="confirmFinalDelete()" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-red-500/30 hover:bg-red-700">Borrar</button>
            </div>
        </div>
    </div>

    <script src="/js/admin/admin_user_crud.js"></script>
</body>
</html>
