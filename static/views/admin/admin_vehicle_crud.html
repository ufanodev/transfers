<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs Admin | Gestión de Vehículo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        admin: {
                            dark: '#1e293b',   // Slate 800
                            accent: '#3b82f6', // Blue 500
                            success: '#10b981' // Emerald 500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-slate-50 flex h-screen overflow-hidden font-sans text-[13px]">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl overflow-y-auto shrink-0 border-r border-slate-700">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'"
                class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span
                    class="text-admin-accent">Us</span> <span
                    class="text-[10px] bg-admin-accent px-1 rounded text-white ml-1">ADMIN</span></h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-6">
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Gestión de Sistema</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                    <li><a href="/admin/clients" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-address-book"></i> Clientes</a></li>
                    <li><a href="/admin/companies" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-building"></i> Empresas</a></li>
                </ul>
            </div>
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Logística</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/drivers" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-id-card"></i> Conductores</a></li>
                    <li><a href="/admin/vehicles" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold transition-all shadow-lg"><i class="fa-solid fa-car"></i> Vehículos</a></li>
                    <li><a href="/admin/rides" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-route"></i> Viajes (Rides)</a></li>
                </ul>
            </div>
        </nav>
        <div class="p-4 bg-slate-900">
            <a href="/logout" class="flex items-center justify-center gap-2 w-full py-2 rounded-lg bg-red-500/20 text-red-400 font-bold hover:bg-red-500 hover:text-white transition-all text-xs">
                <i class="fa-solid fa-power-off"></i> SALIR
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-black p-4 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between overflow-x-auto no-scrollbar">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="window.location.href='/admin/vehicles'" class="bg-admin-accent text-white text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg shadow-lg ring-1 ring-white whitespace-nowrap">Vehicles</button>
                <button onclick="window.location.href='/admin/drivers'" class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Drivers</button>
                <button onclick="window.location.href='/admin/bookings'" class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Bookings</button>
            </div>

            <div class="flex gap-2 shrink-0 ml-4">
                <button onclick="window.location.href='/admin/vehicles'" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-black border-2 border-black hover:bg-black hover:text-white transition-all shadow-sm">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
            </div>
        </header>

        <section class="p-8 overflow-y-auto flex justify-center">
            <div class="w-full max-w-2xl">
                <h2 id="page-title" class="text-lg font-black text-slate-800 uppercase italic mb-6 text-center underline decoration-admin-accent decoration-4 underline-offset-8">Alta de Vehículo</h2>
                
                <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                    <form id="crud-form" class="p-8 space-y-6">
                        <input type="hidden" id="vehicleId">
                        
                        <div class="bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-300">
                            <label class="text-[9px] font-black text-slate-400 uppercase italic">Asignar a Empresa (Propietario Legal)</label>
                            <select id="company_id" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-1 focus:ring-admin-accent mt-1">
                                <option value="">Cargando empresas...</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Marca (Make)</label>
                                <input type="text" id="make" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold uppercase focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Modelo</label>
                                <input type="text" id="model_name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold uppercase focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Matrícula (Plate)</label>
                                <input type="text" id="plate_number" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold uppercase focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Tipo de Servicio</label>
                                <select id="vehicle_type" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold outline-none focus:ring-1 focus:ring-admin-accent">
                                    <option value="economy">Economy</option>
                                    <option value="comfort">Comfort</option>
                                    <option value="business">Business</option>
                                    <option value="vip">VIP</option>
                                    <option value="minivan">Minivan</option>
                                </select>
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Capacidad (PAX)</label>
                                <input type="number" id="capacity_pax" required value="4" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Nº Licencia Transporte</label>
                                <input type="text" id="license_number" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold uppercase focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Vencimiento Licencia</label>
                                <input type="date" id="license_expiry_date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Categoría</label>
                                <input type="text" id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold uppercase focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase ml-1">Tarifa Base (€)</label>
                                <input type="number" id="base_fare" step="0.01" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold focus:ring-1 focus:ring-admin-accent outline-none">
                            </div>
                            <div class="space-y-1 flex flex-col items-center">
                                <label class="text-[9px] font-black text-slate-500 uppercase mb-2">Estado Activo</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="is_active" class="sr-only peer" checked>
                                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-admin-success"></div>
                                </label>
                            </div>
                        </div>

                        <div class="pt-6">
                            <button type="submit" id="btn-save" class="w-full bg-admin-dark text-white py-3.5 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-admin-accent transition-all shadow-xl active:scale-95">Guardar Vehículo</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/admin/admin_vehicle_crud.js"></script>
</body>
</html>
