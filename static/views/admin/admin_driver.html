<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs Admin | Gestión de Conductores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { admin: { dark: '#1e293b', accent: '#3b82f6', success: '#10b981' } } } }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-size: 0.85rem; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl overflow-y-auto shrink-0 border-r border-slate-700">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'" class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span class="text-admin-accent">Us</span> <span class="text-[10px] bg-admin-accent px-1 rounded text-white ml-1">ADMIN</span></h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-6">
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Gestión de Sistema</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                    <li><a href="/admin/companies" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all"><i class="fa-solid fa-building"></i> Empresas</a></li>
                    <li><a href="/admin/drivers" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold transition-all shadow-lg"><i class="fa-solid fa-id-card"></i> Conductores</a></li>
                </ul>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-black p-4 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between overflow-x-auto no-scrollbar">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="window.location.href='/admin/companies'" class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all">Companies</button>
                <button onclick="window.location.href='/admin/drivers'" class="bg-admin-accent text-white text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg shadow-lg ring-1 ring-white">Drivers</button>
                <button onclick="window.location.href='/admin/vehicles'" class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all">Vehicles</button>
                <button onclick="window.location.href='/admin/rides'" class="bg-slate-800 text-slate-400 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-lg hover:bg-admin-accent hover:text-white transition-all">Rides</button>
            </div>

            <div class="flex gap-2 shrink-0 ml-4">
                <button onclick="exportData('pdf')" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white transition-all shadow-sm"><i class="fa-solid fa-file-pdf text-xs"></i></button>
                <button onclick="exportData('excel')" class="w-8 h-8 flex items-center justify-center rounded-full bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white transition-all shadow-sm"><i class="fa-solid fa-file-excel text-xs"></i></button>
                <button onclick="window.location.href='/admin'" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-black border-2 border-black hover:bg-black hover:text-white transition-all shadow-sm"><i class="fa-solid fa-arrow-left text-xs"></i></button>
            </div>
        </header>

        <section class="p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-6">
                    <div class="w-full md:w-2/3">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Búsqueda de Conductores</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="driverSearch" placeholder="Nombre, Licencia o Empresa..." class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-admin-accent outline-none shadow-sm transition-all" onkeyup="filterDrivers()">
                        </div>
                    </div>
                    <button onclick="window.location.href='/admin/drivers/manage'" class="bg-admin-dark text-white px-6 py-2.5 rounded-xl font-black text-[10px] hover:bg-admin-accent transition-all shadow-xl flex items-center gap-2 uppercase tracking-widest border border-slate-700">
                        <i class="fa-solid fa-id-card-clip"></i> NUEVO CONDUCTOR
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-[10px] font-black text-admin-accent uppercase italic">
                        <span id="pagination-info">Cargando flota...</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-200">
                                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-6 py-4">Conductor / Licencia</th>
                                    <th class="px-6 py-4">Empresa / Contacto</th>
                                    <th class="px-6 py-4 text-center">Disponibilidad</th>
                                    <th class="px-6 py-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="driver-table-body" class="divide-y divide-slate-100 text-sm font-medium italic">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="delete-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border-2 border-red-500">
            <h3 class="text-red-600 font-black uppercase italic mb-2 text-sm">Eliminar Conductor</h3>
            <p class="text-[11px] text-slate-500 mb-6 font-medium leading-tight">Para borrar a <span id="confirm-item-name" class="font-bold text-slate-800"></span>, escriba su nombre, ID <span id="confirm-item-id" class="font-bold text-red-600"></span> y 'ELIMINAR'.</p>
            <input type="hidden" id="delete-id">
            <div class="space-y-2">
                <input type="text" id="confirm-input-name" placeholder="Nombre completo" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-[10px] font-bold outline-none uppercase">
                <input type="text" id="confirm-input-id" placeholder="ID del conductor" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3 text-[10px] font-bold outline-none">
                <input type="text" id="confirm-key" placeholder="Escriba 'ELIMINAR'" class="w-full bg-red-50 border border-red-100 rounded-lg py-2 px-3 text-[10px] font-bold outline-none text-red-600 uppercase">
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeDeleteModal()" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-[10px] font-black uppercase">Cancelar</button>
                <button onclick="confirmFinalDelete()" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="/js/admin/admin_driver.js"></script>
</body>
</html>
