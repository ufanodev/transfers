<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cliente | TakeUs Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#064e3b',
                            primary: '#10b981',
                            light: '#f8fafc',
                            accent: '#d1fae5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-brand-light min-h-screen font-sans">

<nav class="bg-black p-4 shadow-2xl sticky top-0 z-50 border-b-2 border-[#10b981]">
    <div class="container mx-auto flex items-center justify-between gap-4">
        <div onclick="window.location.href='/admin'" class="cursor-pointer shrink-0 flex items-center bg-[#10b981] px-4 py-2 rounded-lg shadow-lg hover:scale-105 transition-transform">
            <span class="text-white font-black text-xl tracking-tighter uppercase leading-none">Take</span>
            <span class="text-black font-black text-xl tracking-tighter uppercase ml-0.5 leading-none">Us</span>
        </div>
        
        <div class="flex overflow-x-auto gap-2 no-scrollbar py-1">
            <button onclick="window.location.href='/dashboard/admin/users'" class="bg-[#10b981] text-black text-[11px] font-black uppercase px-4 py-2 rounded shadow hover:bg-white transition-all whitespace-nowrap">Users</button>
            <button onclick="window.location.href='/dashboard/admin/clients'" class="bg-[#10b981] text-black text-[11px] font-black uppercase px-4 py-2 rounded shadow hover:bg-white transition-all whitespace-nowrap ring-2 ring-white">Clients</button>
        </div>

        <button onclick="window.location.href='/dashboard/admin/clients'" class="w-9 h-9 flex items-center justify-center rounded-full bg-white text-black hover:bg-black hover:text-white border-2 border-black transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
    </div>
</nav>

<main class="container mx-auto py-8 px-4">
    <div class="max-w-md mx-auto">
        <h2 id="page-title" class="text-2xl font-black text-black uppercase italic mb-6 text-center tracking-tighter underline decoration-[#10b981] decoration-4 underline-offset-8">Formulario Cliente</h2>
        
        <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100">
            <form id="crud-form" class="p-6 md:p-8 space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-widest">ID de Usuario Vinculado</label>
                    <input type="number" id="user_id" required class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-4 py-2.5 focus:border-[#10b981] outline-none font-bold text-sm transition-all shadow-inner" placeholder="Ej: 42">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-widest">Nombre Completo</label>
                    <input type="text" id="full_name" required class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-4 py-2.5 focus:border-[#10b981] outline-none font-bold text-sm transition-all shadow-inner uppercase">
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-widest">Email Contacto</label>
                        <input type="email" id="email" required class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-4 py-2.5 focus:border-[#10b981] outline-none font-bold text-sm transition-all shadow-inner">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-widest">Teléfono / WhatsApp</label>
                        <input type="text" id="phone" required class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-4 py-2.5 focus:border-[#10b981] outline-none font-bold text-sm transition-all shadow-inner">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1 tracking-widest">Preferencias (JSON)</label>
                    <textarea id="preferences" rows="2" class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-4 py-2.5 focus:border-[#10b981] outline-none font-mono text-[10px] transition-all shadow-inner" placeholder='{"lang": "es", "newsletter": true}'></textarea>
                </div>

                <div class="flex flex-col gap-2 pt-4">
                    <button type="submit" id="btn-save" class="w-full bg-black text-[#10b981] py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-[#10b981] hover:text-black transition-all shadow-lg active:scale-95 border border-[#10b981]">
                        Confirmar Cliente
                    </button>
                    
                    <button type="button" id="btn-delete" class="hidden w-full bg-white text-red-500 border border-red-100 py-2 rounded-xl font-black uppercase text-[9px] tracking-widest hover:bg-red-500 hover:text-white transition-all shadow-sm">
                        Eliminar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/js/admin_client_crud.js"></script>
</body>
</html>
