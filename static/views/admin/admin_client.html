<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs | Gestión Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sort-icon { font-size: 8px; margin-left: 4px; opacity: 0.5; }
        th.active-sort .sort-icon { opacity: 1; color: #10b981; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-black p-3 shadow-2xl sticky top-0 z-50 border-b-2 border-[#10b981]">
        <div class="container mx-auto flex items-center justify-between gap-4">
            <div onclick="window.location.href='/dashboard/'" class="cursor-pointer shrink-0 flex items-center bg-[#10b981] px-3 py-1.5 rounded-lg shadow-lg hover:scale-105 transition-transform">
                <span class="text-white font-black text-lg uppercase leading-none">Take</span>
                <span class="text-black font-black text-lg uppercase ml-0.5 leading-none">Us</span>
            </div>
            
            <div class="flex overflow-x-auto gap-2 no-scrollbar py-1">
                <button onclick="window.location.href='/dashboard/users'" class="bg-[#10b981] text-black text-[10px] font-black uppercase px-3 py-1.5 rounded shadow hover:bg-white transition-all whitespace-nowrap">Users</button>
                <button onclick="window.location.href='/clients'" class="bg-[#10b981] text-black text-[10px] font-black uppercase px-3 py-1.5 rounded shadow hover:bg-white transition-all whitespace-nowrap ring-1 ring-white">Clients</button>
                <button onclick="window.location.href='/companies'" class="bg-[#10b981] text-black text-[10px] font-black uppercase px-3 py-1.5 rounded shadow hover:bg-white transition-all whitespace-nowrap">Companies</button>
                <button onclick="window.location.href='/drivers'" class="bg-[#10b981] text-black text-[10px] font-black uppercase px-3 py-1.5 rounded shadow hover:bg-white transition-all whitespace-nowrap">Drivers</button>
            </div>

            <div class="flex gap-2 shrink-0">
                <button onclick="window.location.href='/dashboard/'" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-black hover:bg-black hover:text-white border border-black transition-all shadow-lg">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-6 px-4 max-w-4xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-black uppercase italic tracking-tighter">Clientes</h2>
            <button onclick="window.location.href='/dashboard/clients/manage'" 
                class="bg-black text-[#10b981] px-4 py-2 rounded-lg font-black text-[10px] hover:bg-[#10b981] hover:text-black transition-all shadow-xl border border-[#10b981] uppercase">
                + NUEVO CLIENTE
            </button>
        </div>

        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
            <div class="p-2 bg-gray-900 flex justify-between items-center px-4">
                <div class="flex items-center gap-2">
                    <span class="text-[8px] font-black text-white uppercase italic">Filas:</span>
                    <select id="pageSize" onchange="loadClients()" class="bg-[#10b981] text-black rounded px-1.5 py-0.5 text-[9px] font-black outline-none cursor-pointer">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="0">ALL</option>
                    </select>
                </div>
                <div id="pagination-info" class="text-[9px] font-black text-[#10b981] uppercase tracking-tighter">
                    REGISTROS: 0 / 0
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr class="text-[8px] font-black text-gray-400 uppercase tracking-widest">
                            <th class="px-3 py-2 cursor-pointer hover:text-black" onclick="sortData('id')">ID <span class="sort-icon">▲▼</span></th>
                            <th class="px-3 py-2 cursor-pointer hover:text-black" onclick="sortData('full_name')">Nombre Completo <span class="sort-icon">▲▼</span></th>
                            <th class="px-3 py-2">Contacto</th>
                            <th class="px-3 py-2 text-center">Preferencias</th>
                            <th class="px-3 py-2 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="client-table-body" class="divide-y divide-gray-100 text-[10px] italic font-medium">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/js/admin_client.js"></script>
</body>
</html>
