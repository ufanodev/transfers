<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs Admin | Monitor de Reservas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        admin: {
                            dark: '#1e293b',   // Slate 800
                            accent: '#3b82f6', // Blue 500
                            success: '#10b981', // Emerald 500
                            warning: '#f59e0b'  // Amber 500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-size: 0.85rem; }
    </style>
</head>

<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-64 bg-admin-dark text-white flex flex-col shadow-2xl overflow-y-auto shrink-0 border-r border-slate-700">
        <div class="p-6 text-center border-b border-slate-700">
            <h2 onclick="window.location.href='/admin'" class="text-xl font-black italic tracking-tighter uppercase cursor-pointer">Take<span class="text-admin-accent">Us</span> <span class="text-[10px] bg-admin-accent px-1 rounded text-white ml-1">ADMIN</span></h2>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-6">
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Gestión de Sistema</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                    <li><a href="/admin/clients" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-address-book"></i> Clientes</a></li>
                    <li><a href="/admin/companies" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-building"></i> Empresas</a></li>
                </ul>
            </div>
            <div>
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Logística</h3>
                <ul class="space-y-1">
                    <li><a href="/admin/drivers" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-id-card"></i> Conductores</a></li>
                    <li><a href="/admin/vehicles" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-car"></i> Vehículos</a></li>
                    <li><a href="/admin/rides" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 transition-all text-[11.5px]"><i class="fa-solid fa-route"></i> Viajes (Rides)</a></li>
                    <li><a href="/admin/bookings" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-admin-accent text-white font-bold shadow-lg transition-all text-[11.5px]"><i class="fa-solid fa-calendar-check"></i> Reservas</a></li>
                </ul>
            </div>
        </nav>
        <div class="p-4 bg-slate-900 mt-auto">
            <a href="/logout" class="flex items-center justify-center gap-2 w-full py-2 rounded-lg bg-red-500/20 text-red-400 font-bold hover:bg-red-500 hover:text-white transition-all text-xs">
                <i class="fa-solid fa-power-off"></i> SALIR
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">

        <header class="bg-black p-3 shadow-2xl border-b-2 border-admin-accent flex items-center justify-between overflow-x-auto no-scrollbar">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="window.location.href='/admin/bookings'" class="bg-admin-accent text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg shadow-lg ring-1 ring-white whitespace-nowrap">Monitor Reservas</button>
                <button onclick="window.location.href='/admin/rides'" class="bg-slate-800 text-slate-400 text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Monitor Rides</button>
                <button onclick="window.location.href='/admin/payments'" class="bg-slate-800 text-slate-400 text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg hover:bg-admin-accent hover:text-white transition-all whitespace-nowrap">Pagos</button>
            </div>

            <div class="flex gap-2 shrink-0 ml-4">
                <button onclick="exportData('pdf')" class="w-7 h-7 flex items-center justify-center rounded-full bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white transition-all" title="Exportar PDF"><i class="fa-solid fa-file-pdf text-[10px]"></i></button>
                <button onclick="exportData('excel')" class="w-7 h-7 flex items-center justify-center rounded-full bg-emerald-600/20 text-emerald-500 hover:bg-emerald-600 hover:text-white transition-all" title="Exportar Excel"><i class="fa-solid fa-file-excel text-[10px]"></i></button>
                <button onclick="window.location.href='/admin'" class="w-7 h-7 flex items-center justify-center rounded-full bg-white text-black border-2 border-black hover:bg-black hover:text-white transition-all" title="Volver al Panel"><i class="fa-solid fa-arrow-left text-[10px]"></i></button>
            </div>
        </header>

        <section class="p-6 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                
                <div class="flex flex-col md:flex-row justify-between items-end gap-4 mb-4">
                    <div class="w-full md:w-1/2">
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 block italic">Filtrar Reservas</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"></i>
                            <input type="text" id="bookingSearch" placeholder="Nombre cliente, origen o destino..." class="w-full bg-white border border-slate-200 rounded-lg py-2 pl-9 pr-4 text-[11.5px] outline-none shadow-sm transition-all italic focus:ring-1 focus:ring-admin-accent" onkeyup="filterBookings()">
                        </div>
                    </div>
                    <button onclick="window.location.href='/admin/bookings/manage'" class="bg-admin-dark text-white px-4 py-2 rounded-lg font-black text-[9px] hover:bg-admin-accent transition-all shadow-md flex items-center gap-2 uppercase tracking-widest border border-slate-700">
                        <i class="fa-solid fa-calendar-plus text-[9px]"></i> NUEVA RESERVA
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-200 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                                <tr>
                                    <th class="px-5 py-3">Fecha / Hora</th>
                                    <th class="px-5 py-3">Cliente / Teléfono</th>
                                    <th class="px-5 py-3">Ruta (Recogida > Destino)</th>
                                    <th class="px-5 py-3 text-center">Carga (P/M/A)</th>
                                    <th class="px-5 py-3">Estado</th>
                                    <th class="px-5 py-3 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="booking-table-body" class="divide-y divide-slate-100 text-[11px] font-medium italic">
                                </tbody>
                        </table>
                    </div>
                </div>
                
                <div id="loading-spinner" class="hidden flex justify-center p-10">
                    <i class="fa-solid fa-circle-notch fa-spin text-admin-accent text-2xl"></i>
                </div>

            </div>
        </section>
    </main>

    <script src="/js/admin/admin_booking.js"></script>
</body>
</html>
