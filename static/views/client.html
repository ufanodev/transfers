<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cliente | Transfers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#064e3b',
                            primary: '#10b981',
                            light: '#f0fdf4',
                            accent: '#d1fae5',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light min-h-screen font-sans">

    <nav class="bg-black text-white p-4 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Transfers <span class="text-brand-primary">Client</span></h1>
            <div class="flex items-center gap-4">
                <span class="text-xs font-medium bg-brand-dark px-2 py-1 rounded text-brand-pastel">SESIÓN ACTIVA</span>
                <a href="/logout" class="text-sm font-bold hover:text-red-400 transition-colors">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-brand-dark">Panel de Control</h2>
            <p class="text-gray-600 mt-2">Bienvenido a su área personal de cliente.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-4xl mx-auto">
            
            <button onclick="testAPI('bookings')" class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Nueva Reserva</span>
            </button>

            <button onclick="testAPI('rides')" class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Mis Viajes</span>
            </button>

            <button onclick="testAPI('payments')" class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Pagos y Facturas</span>
            </button>

            <button onclick="testAPI('users')" class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Mi Perfil</span>
            </button>

            <button class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Soporte 24/7</span>
            </button>

            <button onclick="testAPI('ratings')" class="group p-6 bg-white rounded-2xl shadow-md border-2 border-transparent hover:border-brand-primary transition-all flex flex-col items-center gap-3">
                <div class="p-3 bg-brand-accent rounded-full text-brand-dark group-hover:bg-brand-primary group-hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                    </svg>
                </div>
                <span class="font-bold text-gray-800">Valorar Servicio</span>
            </button>

        </div>

        <div id="api-result" class="mt-12 max-w-4xl mx-auto hidden">
            <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Resultado de la petición API:</h4>
            <pre class="bg-black text-brand-primary p-4 rounded-xl text-xs overflow-auto max-h-60 shadow-inner"></pre>
        </div>
    </main>

    <script>
        /**
         * Función simbólica para probar la conexión con el Backend de Go
         * @param {string} endpoint 
         */
        async function testAPI(endpoint) {
            const resultDiv = document.getElementById('api-result');
            const pre = resultDiv.querySelector('pre');
            
            try {
                const res = await fetch(`/api/v1/${endpoint}`);
                if (res.status === 401) {
                    alert("Sesión expirada. Redirigiendo...");
                    window.location.href = "/";
                    return;
                }
                const data = await res.json();
                
                resultDiv.classList.remove('hidden');
                pre.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error("Error API:", err);
            }
        }
    </script>
</body>
</html>
