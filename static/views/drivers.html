<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeUs | Panel Conductor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-black p-3 shadow-2xl sticky top-0 z-50 border-b-2 border-[#10b981]">
        <div class="container mx-auto flex items-center justify-between gap-4">
            
            <div onclick="window.location.href='/dashboard/'" class="cursor-pointer shrink-0 flex items-center bg-[#10b981] px-3 py-1.5 rounded-lg shadow-lg hover:scale-105 transition-transform">
                <span class="text-white font-black text-lg tracking-tighter uppercase leading-none">Take</span>
                <span class="text-black font-black text-lg tracking-tighter uppercase ml-0.5 leading-none">Us</span>
            </div>

            <div class="flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-full border border-emerald-900">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#10b981] opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-[#10b981]"></span>
                </span>
                <span class="hidden sm:inline text-[9px] font-black text-[#10b981] uppercase tracking-widest">En Línea</span>
            </div>

            <div class="flex gap-2 shrink-0">
                <button onclick="window.location.href='/logout'" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-black hover:bg-red-600 hover:text-white transition-all shadow-lg" title="Cerrar Sesión">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-8 px-4 max-w-3xl">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl md:text-3xl font-black text-black uppercase italic tracking-tighter">Panel de Conductor</h2>
            <div class="h-1 w-16 bg-[#10b981] mx-auto mt-1 rounded-full"></div>
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-3 italic">ID: #0042 • Gestión de Viajes</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
            
            <button onclick="testAPI('rides')" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Ruta Actual</span>
            </button>

            <button onclick="testAPI('bookings')" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Agenda</span>
            </button>

            <button onclick="testAPI('vehicles')" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Vehículo</span>
            </button>

            <button onclick="testAPI('payments')" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Ganancias</span>
            </button>

            <button onclick="testAPI('ratings')" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Puntuación</span>
            </button>

            <button onclick="window.location.href='/dashboard/profile'" class="group p-5 bg-white rounded-2xl shadow-md border-b-4 border-[#10b981] hover:bg-[#d1fae5] transition-all flex flex-col items-center gap-3">
                <div class="text-black group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <span class="font-black text-[9px] uppercase tracking-widest text-gray-800">Mi Perfil</span>
            </button>

        </div>

        <div id="api-result" class="mt-8 hidden animate-fade-in">
            <div class="bg-black text-[#10b981] p-4 rounded-xl shadow-2xl overflow-x-auto border-t-2 border-[#10b981]">
                <div class="flex justify-between items-center border-b border-emerald-900 pb-2 mb-2">
                    <span class="text-[9px] font-black uppercase italic tracking-widest">Información en tiempo real</span>
                    <button onclick="document.getElementById('api-result').classList.add('hidden')" class="text-white text-[9px] font-black hover:text-red-500 transition-colors uppercase">Cerrar X</button>
                </div>
                <pre class="text-[10px] font-mono whitespace-pre-wrap"></pre>
            </div>
        </div>
    </main>

    <script>
        /**
         * Simulación de carga de datos para el Driver
         */
        async function testAPI(endpoint) {
            const resultDiv = document.getElementById('api-result');
            const pre = resultDiv.querySelector('pre');
            
            try {
                const res = await fetch(`/api/v1/${endpoint}`);
                if (res.status === 401) {
                    window.location.href = "/";
                    return;
                }
                const data = await res.json();
                
                resultDiv.classList.remove('hidden');
                pre.textContent = "// " + endpoint.toUpperCase() + " DATA:\n" + JSON.stringify(data, null, 2);
                console.log(`Endpoint ${endpoint} cargado:`, data);
            } catch (err) {
                console.error("Error:", err);
                alert("Error al conectar con el servidor.");
            }
        }
    </script>
</body>
</html>
