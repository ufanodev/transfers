<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Transfers System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#064e3b',   
                            primary: '#10b981', 
                            light: '#f0fdf4',   
                            accent: '#d1fae5',  
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-brand-light flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-brand-accent">
        
        <div class="bg-black p-10 text-center">
            <div class="inline-block p-3 rounded-full bg-brand-primary mb-4 shadow-lg shadow-brand-primary/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white tracking-tight italic uppercase">Take<span class="text-brand-primary">Us</span></h2>
            <p class="text-brand-primary text-[10px] mt-2 font-black uppercase tracking-[0.4em]">Panel de Control Central</p>
        </div>

        <div class="p-8 sm:p-10">
            <div id="error-message" class="hidden animate-fade mb-6 p-4 rounded-xl bg-red-50 border border-red-100 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <span class="text-red-700 text-xs font-bold uppercase tracking-tighter italic">Error de acceso</span>
            </div>

            <form id="login-form" class="space-y-6">
                
                <div class="group">
                    <label for="email" class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Correo electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent outline-none transition-all
                        focus:bg-white focus:border-brand-primary focus:ring-4 focus:ring-brand-accent text-gray-800 font-medium placeholder:text-gray-300"
                        placeholder="admin@transfers.com">
                </div>

                <div class="group">
                    <label for="password" class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent outline-none transition-all
                        focus:bg-white focus:border-brand-primary focus:ring-4 focus:ring-brand-accent text-gray-800 font-medium placeholder:text-gray-300"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" id="keep-logged-in" class="w-4 h-4 rounded border-gray-300 text-brand-primary focus:ring-brand-primary transition-all">
                        <span class="ml-2 text-xs text-gray-400 group-hover:text-gray-600 transition-colors font-medium">Recordarme</span>
                    </label>
                    <a href="#" class="text-xs font-bold text-brand-dark hover:text-brand-primary transition-colors uppercase tracking-tighter underline">Soporte IT</a>
                </div>

                <button type="submit" 
                    class="w-full bg-black text-white font-black py-4 rounded-2xl hover:bg-brand-dark transition-all transform active:scale-95 shadow-xl uppercase tracking-[0.2em] text-sm italic">
                    Iniciar sesión
                </button>
            </form>
        </div>

        <div class="p-6 bg-gray-50 text-center border-t border-gray-100">
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">© 2026 TakeUs Enterprise Solution</p>
        </div>
    </div>

    <script src="/js/auth/login.js"></script>
</body>
</html>
