<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Transfers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#064e3b',   
                            primary: '#10b981', 
                            light: '#f0fdf4',   
                            accent: '#d1fae5',  
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-brand-accent">
        <div class="bg-black p-10 text-center">
            <div class="inline-block p-3 rounded-full bg-brand-primary mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Transfers System</h2>
            <p class="text-brand-primary text-sm mt-2 font-medium uppercase tracking-widest">Acceso Privado</p>
        </div>

        <div class="p-8 sm:p-10">
            <div id="error-message" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <span class="text-red-700 text-sm font-medium">Credenciales incorrectas</span>
            </div>

            <form id="login-form" class="space-y-6">
                <div class="group">
                    <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Correo electrónico</label>
                    <input type="email" id="email" name="email" value="diazufano@gmail.com" required
                        class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent outline-none transition-all
                        focus:bg-white focus:border-brand-primary focus:ring-4 focus:ring-brand-accent text-gray-800 font-medium">
                </div>

                <div class="group">
                    <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Contraseña</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent outline-none transition-all
                        focus:bg-white focus:border-brand-primary focus:ring-4 focus:ring-brand-accent text-gray-800 font-medium">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" id="keep-logged-in" class="w-5 h-5 rounded border-gray-300 text-brand-primary focus:ring-brand-primary transition-all">
                        <span class="ml-3 text-sm text-gray-500 group-hover:text-gray-700 transition-colors">Mantener sesión</span>
                    </label>
                    <a href="passlost.html" class="text-sm font-bold text-brand-dark hover:text-brand-primary transition-colors">¿Olvidé mi clave?</a>
                </div>

                <button type="submit" 
                    class="w-full bg-black text-white font-bold py-4 rounded-2xl hover:bg-brand-dark transition-all transform active:scale-95 shadow-xl">
                    Iniciar sesión
                </button>
            </form>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
