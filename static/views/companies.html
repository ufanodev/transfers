<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empresa | Transfers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#064e3b',
                            primary: '#10b981',
                            light: '#f0fdf4',
                            accent: '#d1fae5',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light min-h-screen font-sans">

    <nav class="bg-black text-white p-4 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight uppercase">Transfers <span class="text-brand-primary text-sm">Business</span></h1>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-bold border border-brand-primary px-2 py-1 rounded text-brand-primary uppercase">Portal Empresa</span>
                <a href="/logout" class="text-sm font-bold hover:text-brand-primary transition-colors">Salir</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-12 px-4">
        <div class="max-w-4xl mx-auto mb-10 flex items-end justify-between">
            <div>
                <h2 class="text-3xl font-extrabold text-black">Gestión de Operaciones</h2>
                <p class="text-brand-dark font-medium mt-1">Panel de control de flota y personal</p>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Estado del Sistema</p>
                <p class="text-brand-primary font-bold text-sm">● Operativo</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-4xl mx-auto">
            
            <button onclick="testAPI('vehicles')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Flota</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Gestión de Vehículos</span>
                </div>
            </button>

            <button onclick="testAPI('drivers')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Staff</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Conductores</span>
                </div>
            </button>

            <button onclick="testAPI('rides')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Servicios</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Rutas en curso</span>
                </div>
            </button>

            <button onclick="testAPI('payments')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Finanzas</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Ingresos y Pagos</span>
                </div>
            </button>

            <button onclick="testAPI('bookings')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Agenda</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Próximas Reservas</span>
                </div>
            </button>

            <button onclick="testAPI('ratings')" class="group p-8 bg-white rounded-3xl shadow-sm hover:shadow-2xl hover:shadow-brand-accent/40 border border-gray-100 transition-all flex flex-col items-center text-center gap-4">
                <div class="p-4 bg-black text-brand-primary rounded-2xl group-hover:bg-brand-primary group-hover:text-white transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-black text-black text-lg">Feedback</span>
                    <span class="text-xs text-gray-400 font-bold uppercase">Calidad del servicio</span>
                </div>
            </button>

        </div>

        <div id="api-result" class="mt-12 max-w-4xl mx-auto hidden transition-opacity duration-500">
            <div class="bg-black rounded-3xl p-6 shadow-2xl border border-brand-dark">
                 <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-black text-brand-primary uppercase tracking-widest italic">Live Data Monitor</span>
                    <button onclick="document.getElementById('api-result').classList.add('hidden')" class="text-gray-500 hover:text-white text-xs uppercase font-bold tracking-tighter">Cerrar x</button>
                 </div>
                <pre class="text-brand-primary text-[11px] leading-relaxed overflow-auto max-h-80 custom-scrollbar"></pre>
            </div>
        </div>
    </main>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #064e3b; border-radius: 10px; }
    </style>

    <script>
        async function testAPI(endpoint) {
            const resultDiv = document.getElementById('api-result');
            const pre = resultDiv.querySelector('pre');
            
            try {
                const res = await fetch(`/api/v1/${endpoint}`);
                if (res.status === 401) {
                    window.location.href = "/";
                    return;
                }
                const data = await res.json();
                
                resultDiv.classList.remove('hidden');
                pre.textContent = "// GET /api/v1/" + endpoint + "\n" + JSON.stringify(data, null, 2);
            } catch (err) {
                console.error("Error API:", err);
            }
        }
    </script>
</body>
</html>
